<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Витрина Ласточка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Склад "Ласточка"</h1>
    <div id="status">Загрузка данных...</div>
    <div id="products" class="grid"></div>

    <script>
        // ВСТАВЬ СЮДА НОВУЮ ССЫЛКУ ИЗ ГУГЛА:
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCUjjl1VKYiRwTG59Bnk5cLwFdVY_hCbiUpqwLtVt04zgF1NmX-1DETYAkeHRZEoDt/exec";

        async function init() {
            try {
                const response = await fetch(WEB_APP_URL);
                const storeData = await response.json();
                
                document.getElementById('status').style.display = 'none';
                const container = document.getElementById('products');
                
                storeData["Товары"].forEach(item => {
                    const imgUrl = item["фото"] ? "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/" + item["фото"] : "";
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}">` : ''}
                        <p>${item["назва"]}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('status').innerText = "Ошибка: " + err.message;
                console.error(err);
            }
        }
        init();
    </script>
</body>
</html>
