<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Витрина Ласточка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .loader { text-align: center; font-size: 18px; padding: 50px; }
    </style>
</head>
<body>
    <h1>Склад "Ласточка"</h1>
    <div id="status" class="loader">Загрузка данных с сервера...</div>
    <div id="products" class="grid"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCUjjl1VKYiRwTG59Bnk5cLwFdVY_hCbiUpqwLtVt04zgF1NmX-1DETYAkeHRZEoDt/exec"; 
        // Функция кодирования путей для обхода кириллицы
        function getFullCdnUrl(explicitImgPath) {
            const baseUrl = "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/data";
            if (!explicitImgPath || explicitImgPath === "—") return "";
            let path = explicitImgPath.trim();
            if (path.startsWith("http")) return path;
            return `${baseUrl}/${path.split('/').map(p => encodeURIComponent(p)).join('/')}`;
        }

        async function init() {
            try {
                const response = await fetch(WEB_APP_URL);
                const storeData = await response.json();
                document.getElementById('status').style.display = 'none';
                
                const container = document.getElementById('products');
                // Берем первую категорию для теста
                const firstCat = Object.keys(storeData)[0];
                storeData[firstCat].forEach(item => {
                    const imgUrl = getFullCdnUrl(item["фото"] || "");
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}" style="width:100%; height:150px; object-fit:cover;">` : '<div style="height:150px; background:#eee;"></div>'}
                        <p>${item["назва"] || "Товар"}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('status').innerText = "Ошибка: " + err.message;
            }
        }
        window.onload = init;
    </script>
</body>
</html>
