<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Витрина Ласточка</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tailwind utilities are used for most styling */
    body { @apply bg-gray-100 font-sans; }
    h1 { @apply text-2xl font-bold text-center text-gray-800 mb-6; }
  </style>
</head>
<body>
  <h1>Склад "Ласточка"</h1>
  <div id="status" class="text-center text-gray-600">Загрузка данных…</div>
  <div id="products" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4"></div>

  <script>
    async function init() {
      try {
        const resp = await fetch('data.json');
        if (!resp.ok) throw new Error('data.json not found');
        const data = await resp.json();
        document.getElementById('status').style.display = 'none';
        const container = document.getElementById('products');
        data["Товары"].forEach(item => {
          const imgUrl = "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/" + item["фото"];
          const price = item["цена"] !== undefined ? `<p class="text-primary font-medium mt-2">${item["цена"]} грн</p>` : '';
          const card = document.createElement('div');
          card.className = 'bg-white rounded-lg shadow hover:shadow-lg transition-shadow p-4 flex flex-col items-center';
          card.innerHTML = `
            <img src="${imgUrl}" alt="${item["назва"]}" class="w-full h-48 object-cover rounded" onerror="this.style.display='none'" />
            <h2 class="mt-3 text-sm font-semibold text-center text-gray-800">${item["назва"]}</h2>
            ${price}
          `;
          container.appendChild(card);
        });
      } catch (e) {
        console.error(e);
        document.getElementById('status').innerText = 'Ошибка: ' + e.message;
      }
    }
    init();
  </script>
</body>
</html>
