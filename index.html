<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Витрина Ласточка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        h1 { text-align: center; color: #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        p { margin: 10px 0 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Склад "Ласточка"</h1>
    <div id="status">Загрузка данных...</div>
    <div id="products" class="grid"></div>

    <script>
        async function init() {
            try {
                // Загружаем данные из локального файла data.json
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Файл data.json не найден');
                
                const data = await response.json();
                
                document.getElementById('status').style.display = 'none';
                const container = document.getElementById('products');
                
                data["Товары"].forEach(item => {
                    // Формируем прямую ссылку на фото
                    const imgUrl = "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/" + item["фото"];
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imgUrl}" onerror="this.style.display='none'">
                        <p>${item["назва"]}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Ошибка: " + err.message;
            }
        }
        init();
    </script>
</body>
</html>
