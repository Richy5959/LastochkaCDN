<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Витрина Ласточка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Склад "Ласточка"</h1>
    <div id="status">Загрузка...</div>
    <div id="products" class="grid"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyCUjjl1VKYiRwTG59Bnk5cLwFdVY_hCbiUpqwLtVt04zgF1NmX-1DETYAkeHRZEoDt/exec"; 

        function getFullCdnUrl(explicitImgPath) {
            const baseUrl = "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/data";
            if (!explicitImgPath || explicitImgPath === "—") return "";
            return `${baseUrl}/${explicitImgPath.trim().split('/').map(p => encodeURIComponent(p)).join('/')}`;
        }

        // Эта функция вызовется, когда данные придут от Гугла
        function handleData(storeData) {
            document.getElementById('status').style.display = 'none';
            const container = document.getElementById('products');
            const firstCat = Object.keys(storeData)[0];
            
            storeData[firstCat].forEach(item => {
                const imgUrl = getFullCdnUrl(item["фото"]);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${imgUrl}" style="width:100%; height:150px; object-fit:cover;">
                    <p>${item["назва"]}</p>
                `;
                container.appendChild(card);
            });
        }

        // Запуск JSONP запроса
        const script = document.createElement('script');
        script.src = WEB_APP_URL + "?callback=handleData";
        document.body.appendChild(script);
    </script>
</body>
</html>
