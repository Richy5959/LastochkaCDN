<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Витрина Ласточка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fa; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Склад "Ласточка"</h1>
    <div id="status">Загрузка данных...</div>
    <div id="products" class="grid"></div>

    <script>
        // ВСТАВЬ СЮДА ТУ САМУЮ ССЫЛКУ CSV, КОТОРУЮ ПОЛУЧИЛ ПОСЛЕ ПУБЛИКАЦИИ ТАБЛИЦЫ:
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQPKcEdZVXRHUy8b_a8Xkx61H7NlZbQXgZnGPm3JP1bEnqpQ2M4qFn_XNiEGejVDb5hYLdv-adT7n7r/pub?gid=876258765&single=true&output=csv";

        async function init() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                
                // Простая обработка CSV
                const rows = csvText.split('\n').map(row => row.split(','));
                const headers = rows[0].map(h => h.trim().toLowerCase());
                const idxName = headers.indexOf("название ua");
                const idxPhoto = headers.indexOf("путь к фото");

                document.getElementById('status').style.display = 'none';
                const container = document.getElementById('products');
                
                rows.slice(1).forEach(row => {
                    if (row.length < 2) return;
                    const name = row[idxName];
                    const photoPath = row[idxPhoto]?.trim();
                    const imgUrl = photoPath ? "https://raw.githubusercontent.com/Richy5959/LastochkaCDN/main/" + photoPath : "";
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        ${imgUrl ? `<img src="${imgUrl}">` : ''}
                        <p>${name || "Товар"}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                document.getElementById('status').innerText = "Ошибка: " + err.message;
            }
        }
        init();
    </script>
</body>
</html>
